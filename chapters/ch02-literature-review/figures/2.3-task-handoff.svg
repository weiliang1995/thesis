<svg xmlns="http://www.w3.org/2000/svg" width="828" height="290" viewBox="0 0 828 290" role="img" aria-labelledby="title description">
  <title id="title">Repository state and task information at a session handoff</title>
  <desc id="description">A first session edits the login handler. A later session can inspect the diff and consult task notes explaining why the handler changed and that the second application still needs testing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="828" height="290" fill="#fff"/>
  <g stroke="#475569" stroke-width="1.4">
    <rect x="24" y="98" width="196" height="94" rx="8" fill="#f1f5f9"/>
    <rect x="289" y="27" width="250" height="84" rx="8" fill="#dbeafe"/>
    <rect x="289" y="170" width="250" height="93" rx="8" fill="#fef3c7"/>
    <rect x="608" y="98" width="196" height="94" rx="8" fill="#f1f5f9"/>
  </g>
  <g fill="none" stroke="#334155" stroke-width="1.7">
    <path d="M220 145 H255 M539 69 H574 V216.5 H539"/>
    <g marker-end="url(#arrow)">
      <path d="M255 145 V69 H287"/>
      <path d="M255 145 V216.5 H287"/>
      <path d="M574 145 H606"/>
    </g>
  </g>
  <g fill="#334155">
    <circle cx="255" cy="145" r="3"/>
    <circle cx="574" cy="145" r="3"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#243044">
    <g font-size="16" font-weight="bold">
      <text x="122" y="128">First session</text>
      <text x="414" y="60">Repository state</text>
      <text x="414" y="199">Task notes</text>
      <text x="706" y="128">Later session</text>
    </g>
    <g font-size="14">
      <text x="122" y="151">Investigates the login issue</text>
      <text x="122" y="171">and edits the handler</text>
      <text x="414" y="84">Diff shows the login handler edit</text>
      <text x="414" y="222">Why the handler changed</text>
      <text x="414" y="242">Second application still needs testing</text>
      <text x="706" y="151">Reviews the existing change</text>
      <text x="706" y="171">and the pending check</text>
    </g>
  </g>
</svg>
